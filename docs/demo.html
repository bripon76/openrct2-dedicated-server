<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenRCT2 Server - Vorschau</title>
<style>
:root{--navy:#071b2c;--blue:#669fe3;--cream:#fff7e4;--red:#cf3e3e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#06111dbb,#06111dbb),url('../admin/static/park-demo.svg') center/cover fixed;font:16px system-ui,sans-serif;color:#fff}.nav{max-width:1180px;margin:14px auto;background:var(--blue);padding:12px 20px;border-radius:4px;display:flex;align-items:center;gap:14px}.nav img{width:42px;height:42px;object-fit:contain}.nav b{font-size:20px}.hero{min-height:370px;display:grid;place-items:center;text-align:center}.hero img{width:180px;height:180px;object-fit:contain;filter:drop-shadow(0 8px 14px #000)}h1{font-size:clamp(34px,6vw,64px);font-weight:400;margin:12px 0}.button{display:inline-block;background:var(--blue);color:#fff;padding:12px 18px;border-radius:4px;text-decoration:none;font-weight:700}.grid{max-width:980px;margin:auto;padding:0 16px 36px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#07111ce8;border:1px solid #ffffff33;border-radius:6px;padding:18px;box-shadow:0 10px 28px #0007}.label{color:#bcd0e8;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:25px;font-weight:700;margin-top:5px;color:var(--cream)}footer{text-align:center;padding:22px;background:#050b12e8;color:#d7e6f6}footer a{color:#fff;text-decoration:none;font-weight:700}@media(max-width:650px){.nav{margin:0;border-radius:0}.grid{grid-template-columns:1fr}.hero{min-height:300px}.hero img{width:130px;height:130px}}
</style>
</head>
<body>
<nav class="nav"><img src="../admin/static/openrct2-server-logo.png" alt=""><b>OpenRCT2 Server</b></nav>
<section class="hero"><div><img src="../admin/static/openrct2-server-logo.png" alt="OpenRCT2 Server"><h1>Dein OpenRCT2 Park</h1><p>Serverstatus, Parkansichten und Community an einem Ort.</p><a class="button" href="https://openrct2.io/download">OpenRCT2 herunterladen</a></div></section>
<main class="grid"><section class="card"><div class="label">Status</div><div class="value">Online</div></section><section class="card"><div class="label">Spieler</div><div class="value">0 / 10</div></section><section class="card"><div class="label">Parkwert</div><div class="value">Live-Daten</div></section></main>
<footer>OpenRCT2 Server Demo · <a href="https://github.com/bripon76/openrct2-dedicated-server">GitHub bripon76</a></footer>
</body>
</html>
