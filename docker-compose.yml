services:
  admin:
    build: ./admin
    container_name: openrct2-admin
    restart: unless-stopped
    ports:
      - "8088:8088/tcp"
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"
      MOCK_MODE: "false"
      CONTROL_MODE: "docker"
      GAME_CONTAINER: "openrct2-server"
      OPENRCT2_CONFIG: "/data/config/config.ini"
      SAVE_DIR: "/data/config/save"
      ACTIVE_SAVE_FILE: "/data/config/save/.active-save"
      RCT2_DATA_DIR: "/data/rct2"
      SCREENSHOT_DIR: "/data/config/screenshot"
      OPENRCT2_IMAGE: "${OPENRCT2_IMAGE:-openrct2/openrct2-cli:0.5.5}"
      MAP_REFRESH_SECONDS: "300"
      PUBLIC_HOST: "${PUBLIC_HOST:-openrct2.example.com}"
      PUBLIC_ADDRESS_URL: "${PUBLIC_ADDRESS_URL:-https://api.ipify.org}"
      PUBLIC_ADDRESS_REFRESH_SECONDS: "${PUBLIC_ADDRESS_REFRESH_SECONDS:-300}"
    volumes:
      - ./data/config:/data/config
      - ./data/rct2:/data/rct2
      - /var/run/docker.sock:/var/run/docker.sock

  openrct2:
    image: "${OPENRCT2_IMAGE:-openrct2/openrct2-cli:0.5.5}"
    container_name: openrct2-server
    restart: unless-stopped
    stop_grace_period: 30s
    profiles: ["game"]
    entrypoint: ["/bin/bash", "/server/start-server.sh"]
    ports:
      - "11753:11753/tcp"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/11753"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      SAVE_DIR: "/home/openrct2/.config/OpenRCT2/save"
      ACTIVE_SAVE_FILE: "/home/openrct2/.config/OpenRCT2/save/.active-save"
      RCT2_DATA_DIR: "/rct2"
      OPENRCT2_PORT: "11753"
    volumes:
      - ./data/config:/home/openrct2/.config/OpenRCT2
      - ./data/rct2:/rct2:ro
      - ./server:/server:ro
      - ./plugin/OpenRCT2AdminBridge.js:/home/openrct2/.config/OpenRCT2/plugin/OpenRCT2AdminBridge.js:ro
