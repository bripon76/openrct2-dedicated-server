<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenRCT2 Server</title>
<link rel="icon" href="/static/openrct2-server-logo.png" type="image/png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<style>
:root{--sky:#669fe3;--sky-deep:#376fae;--ink:#f3f8ff;--panel:#07111ce6;--muted:#c6d9ed;--park:url('/static/park-demo.svg')}body{min-height:100vh;background:linear-gradient(#0008,#0008),var(--park) center/cover fixed;color:var(--ink)}.site-nav{max-width:1296px;margin:12px auto 0;background:var(--sky);border-radius:4px;box-shadow:0 10px 30px #0008}.brand{color:#fff;font-size:1.2rem;font-weight:700;text-decoration:none}.nav-link{color:#fff!important;font-weight:500}.nav-link:hover{color:#e7f4ff!important}.hero{min-height:440px;display:grid;place-items:center;text-align:center}.hero-panel{padding:34px 24px;max-width:620px;text-shadow:0 2px 8px #000}.hero-logo{width:118px;height:118px;filter:drop-shadow(0 8px 12px #000b)}.hero h1{font-size:clamp(2.5rem,7vw,4.4rem);font-weight:400}.hero .lead{color:#e7f4ff}.hero-actions{background:#000b;border-radius:5px;padding:12px;display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center}.content{max-width:1100px}.glass{background:var(--panel);border:1px solid #ffffff2b;box-shadow:0 12px 28px #0007;color:var(--ink);backdrop-filter:blur(8px)}.glass .card-header{background:#ffffff12;border-color:#ffffff2b;color:#fff}.metric .label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#b8cde2}.metric .value{font-size:1.35rem;font-weight:700}.online{color:#83eb9e}.offline{color:#ff9898}.carousel-frame{overflow:hidden;background:#000;border-radius:.35rem}.carousel-item img{display:block;width:100%;height:min(58vw,620px);min-height:240px;object-fit:contain}.carousel-control-next-icon,.carousel-control-prev-icon{filter:drop-shadow(0 2px 3px #000)}.player-pill{background:#6da7e8;color:#fff}.site-footer{margin-top:2rem;padding:2rem 1rem;background:#050b12e8;border-top:1px solid #ffffff29;color:var(--muted)}@media(max-width:767.98px){.site-nav{margin:0;border-radius:0}.hero{min-height:390px}.hero-panel{padding:22px 16px}.hero-logo{width:90px;height:90px}.carousel-item img{min-height:205px}.navbar-nav{padding-top:.5rem}}
</style>
</head>
<body>
<header class="container-fluid px-0"><nav class="navbar navbar-expand-md navbar-dark site-nav px-3 py-2"><a class="brand d-flex align-items-center gap-2" id="brand" href="#top" style="visibility:hidden"><img class="brandLogo" src="/static/openrct2-server-logo.png" alt="" width="42" height="42" style="object-fit:contain"></a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#publicNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="publicNav"><ul class="navbar-nav ms-auto align-items-md-center"><li class="nav-item" id="parkNav"><a class="nav-link" href="#park">Parkansichten</a></li><li class="nav-item" id="playersNav"><a class="nav-link" href="#players">Spieler</a></li><li class="nav-item"><a class="nav-link" href="https://openrct2.io/download" target="_blank" rel="noopener">Download</a></li></ul></div></nav></header>
<section class="hero" id="top"><div class="hero-panel"><img class="hero-logo brandLogo" src="/static/openrct2-server-logo.png" alt="OpenRCT2 Server"><h1 class="mt-3 mb-2" id="name" style="visibility:hidden"></h1><p class="lead mb-4" id="description" style="visibility:hidden"></p><div class="hero-actions"><a class="btn btn-primary d-inline-flex align-items-center gap-2" href="https://openrct2.io/download" target="_blank" rel="noopener"><img class="brandLogo" src="/static/openrct2-server-logo.png" alt="" width="24" height="24" style="object-fit:contain">OpenRCT2 herunterladen</a><a id="projectLink" hidden></a></div></div></section>
<main class="container content pb-4"><section class="row g-3 mb-3"><div class="col-6 col-lg-3"><div class="card glass metric h-100"><div class="card-body"><div class="label">Status</div><div class="value" id="status">Lade...</div></div></div></div><div class="col-6 col-lg-3"><div class="card glass metric h-100"><div class="card-body"><div class="label">Adresse</div><div class="value text-break" id="address">-</div></div></div></div><div class="col-6 col-lg-3"><div class="card glass metric h-100"><div class="card-body"><div class="label">Spieler</div><div class="value" id="playerCount">-</div></div></div></div><div class="col-6 col-lg-3"><div class="card glass metric h-100"><div class="card-body"><div class="label">Version</div><div class="value" id="version">-</div></div></div></div></section><section class="card glass mb-3" id="park"><div class="card-header fw-bold">Parkansichten</div><div class="card-body"><div class="carousel slide carousel-fade carousel-frame" id="mapCarousel"><div class="carousel-indicators" id="mapIndicators"></div><div class="carousel-inner" id="mapSlides"><div class="carousel-item active"><img src="/static/park-demo.svg" alt="Parkansicht"></div></div><button class="carousel-control-prev" type="button" data-bs-target="#mapCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span><span class="visually-hidden">Zurück</span></button><button class="carousel-control-next" type="button" data-bs-target="#mapCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span><span class="visually-hidden">Weiter</span></button></div><p class="small mb-0 mt-3 text-center" style="color:var(--muted)">Automatische Ansichten. Stand: <span id="mapUpdated">-</span></p></div></section><section class="card glass" id="players"><div class="card-header fw-bold">Spieler online</div><div class="card-body"><div class="d-flex flex-wrap gap-2" id="playerList"><span style="color:var(--muted)">Lade...</span></div></div></section></main>
<section class="container content pb-2" id="publicInfo" hidden><div class="card glass"><div class="card-header fw-bold" id="publicInfoTitle"></div><div class="card-body" id="publicInfoText" style="white-space:pre-wrap"></div></div></section><section class="container content pb-2" id="publicParkStats" hidden><div class="card glass"><div class="card-header fw-bold">Live-Parkdaten</div><div class="card-body" id="publicParkStatsText"></div></div></section><div class="modal fade" id="mapModal" tabindex="-1"><div class="modal-dialog modal-fullscreen"><div class="modal-content bg-dark"><div class="modal-header border-0"><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body d-flex align-items-center justify-content-center p-2"><img id="mapModalImage" class="mw-100 mh-100" alt="Parkansicht maximiert"></div></div></div></div><footer class="site-footer text-center"><span id="publicFooter"></span><span class="ms-3">© </span><a id="footerProjectLink" href="https://github.com/" target="_blank" rel="noopener" class="text-white fw-bold text-decoration-none">GitHub bripon76</a><span id="publicCopyright"></span></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const colors={RED:'#ff7c7c',YELLOW:'#ffe778',GREEN:'#83eb9e',LIGHT_BLUE:'#9cddff',PURPLE:'#e2b4ff',WHITE:'#fff',ORANGE:'#ffbd79',DARK_BLUE:'#8caeff',DARK_GREEN:'#75cf87',LIGHT_PURPLE:'#ebc6ff',LIGHT_PINK:'#ffc0d9',BROWN:'#d9a778',BLACK:'#1b2730'};
const plainName=value=>String(value??'').replace(/\{[A-Z_]+\}/g,'');
function coloredName(value){let color='';return String(value??'').split(/(\{[A-Z_]+\})/g).map(part=>{const match=part.match(/^\{([A-Z_]+)\}$/);if(match){color=colors[match[1]]||color;return ''}const text=esc(part);return color?'<span style="color:'+color+'">'+text+'</span>':text}).join('')}
function renderCarousel(images,updated){const slides=document.getElementById('mapSlides'),indicators=document.getElementById('mapIndicators'),carousel=document.getElementById('mapCarousel');bootstrap.Carousel.getInstance(carousel)?.dispose();slides.innerHTML=images.map((image,index)=>'<div class="carousel-item '+(index===0?'active':'')+'"><img src="'+esc(image.image)+'" alt="Parkansicht '+(index+1)+'"></div>').join('');indicators.innerHTML=images.map((_,index)=>'<button type="button" data-bs-target="#mapCarousel" data-bs-slide-to="'+index+'" '+(index===0?'class="active" aria-current="true"':'')+' aria-label="Ansicht '+(index+1)+'"></button>').join('');bootstrap.Carousel.getOrCreateInstance(carousel,{interval:6000,ride:'carousel'}).cycle();document.getElementById('mapUpdated').textContent=updated||'-'}
document.getElementById('mapSlides').addEventListener('click',event=>{const image=event.target.closest('img');if(image){document.getElementById('mapModalImage').src=image.src;bootstrap.Modal.getOrCreateInstance(document.getElementById('mapModal')).show()}});
async function refresh(){try{const response=await fetch('/api/status');const state=await response.json();const server=state.server||{};const name=server.name||'OpenRCT2 Server';const image=(state.map||{}).image||'/static/park-demo.svg';document.body.style.setProperty('--park',"url('"+image+"')");document.title=plainName(name)+' · OpenRCT2';document.getElementById('brand').innerHTML='<img src="/static/favicon.svg" alt="" width="42" height="42">'+esc(state.siteTitle||'OpenRCT2 Server');document.getElementById('name').innerHTML=coloredName(name);document.getElementById('description').textContent=server.description||'Multiplayer-Park';for(const id of ['brand','name','description'])document.getElementById(id).style.visibility='visible';document.getElementById('publicFooter').textContent=state.publicFooterText||'';for(const id of ['projectLink','footerProjectLink'])document.getElementById(id).href=state.projectUrl||'https://github.com/';const online=server.state==='running';const status=document.getElementById('status');status.textContent=online?'Online':'Offline';status.className='value '+(online?'online':'offline');document.getElementById('address').textContent=server.address||'-';document.getElementById('playerCount').textContent=(state.players||[]).length+' / '+(server.maxPlayers||'-');document.getElementById('version').textContent=server.version||'-';document.getElementById('playerList').innerHTML=(state.players||[]).map(player=>'<span class="badge rounded-pill player-pill">'+esc(player.name)+'</span>').join('')||'<span style="color:var(--muted)">Keine Spieler online.</span>';const map=state.map||{};renderCarousel(map.images?.length?map.images:[{image:map.image||'/static/park-demo.svg'}],map.updated)}catch(error){document.getElementById('status').textContent='Nicht erreichbar'}}
async function refreshLogo(){try{const state=await (await fetch('/api/status')).json();const url=state.logoUrl||'/static/openrct2-server-logo.png';document.querySelectorAll('.brandLogo').forEach(image=>image.src=url);document.getElementById('brand').querySelector('img').src=url}catch{}}
async function refreshPublicInfo(){try{const state=await (await fetch('/api/status')).json();const info=document.getElementById('publicInfo'),text=state.publicInfoText||'',sections=document.querySelectorAll('main > section'),parkVisible=state.publicShowParkViews!==false,playersVisible=state.publicShowPlayers!==false;info.hidden=!text;sections[0].hidden=state.publicShowServerDetails===false;sections[1].hidden=!parkVisible;sections[2].hidden=!playersVisible;document.getElementById('parkNav').hidden=!parkVisible;document.getElementById('playersNav').hidden=!playersVisible;document.getElementById('publicInfoTitle').textContent=state.publicInfoTitle||'Informationen';document.getElementById('publicInfoText').textContent=text}catch{}}
async function refreshParkStats(){try{const state=await (await fetch('/api/status')).json(),stats=state.parkStats||{},card=document.getElementById('publicParkStats');card.hidden=state.publicShowParkStats===false||!Object.keys(stats).length;document.getElementById('publicParkStatsText').textContent='Besucher: '+(stats.guests??'-')+' · Geld: '+(stats.cash??'-')+' · Parkwert: '+(stats.value??'-')+' · Rating: '+(stats.rating??'-')}catch{}}
document.querySelector('.hero').after(document.getElementById('publicParkStats'));document.querySelector('.hero').after(document.getElementById('publicInfo'));document.getElementById('publicCopyright').textContent=' '+new Date().getFullYear();refresh();refreshLogo();refreshPublicInfo();refreshParkStats();setInterval(refresh,30000);setInterval(refreshLogo,30000);setInterval(refreshPublicInfo,30000);setInterval(refreshParkStats,30000);
</script>
</body>
</html>
