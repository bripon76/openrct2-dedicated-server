<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenRCT2 Server</title>
<style>
:root{--navy:#17384b;--cyan:#00a9d6;--bg:#eef4f7;--line:#d8e2e7;--ink:#334a59;--muted:#71828d;--green:#269b5c;--red:#be4545}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}header{background:var(--navy);border-bottom:4px solid var(--cyan)}.bar,.wrap{max-width:1100px;margin:auto;padding:0 18px}.bar{height:70px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:800;color:#fff}.bar a{color:#d9f6ff;text-decoration:none;font-weight:700}.hero{background:linear-gradient(135deg,#0ba3cd,#087da7);color:#fff;text-align:center;padding:42px 18px}.hero h1{font-size:34px;margin:0}.hero p{color:#d9f6ff;font-size:17px}.wrap{margin-top:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 2px 12px #17384b18;margin-bottom:16px}.stat,.body{padding:18px}.k{font-size:12px;text-transform:uppercase;color:#788892;letter-spacing:.06em}.v{font-size:21px;font-weight:700;color:#24485e;margin-top:5px}.online{color:var(--green)}.offline{color:var(--red)}.head{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;color:#24485e}.map{min-height:320px;border:1px solid var(--line);background:#d8eef4;border-radius:5px;display:grid;place-items:center;overflow:hidden}.map img{max-width:100%;max-height:620px;display:block}.players{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:20px;background:#edf4f7;color:#526d7c}.muted{color:var(--muted)}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.hero h1{font-size:27px}}
</style>
</head>
<body>
<header><div class="bar"><span class="brand" id="brand">OpenRCT2 Server</span><a href="/admin">Admin</a></div></header>
<section class="hero"><h1 id="name">OpenRCT2 Server</h1><p id="description">Multiplayer-Park</p></section>
<main class="wrap"><section class="stats"><div class="card stat"><div class="k">Status</div><div class="v" id="status">Lade...</div></div><div class="card stat"><div class="k">Adresse</div><div class="v" id="address">-</div></div><div class="card stat"><div class="k">Spieler</div><div class="v" id="playerCount">-</div></div><div class="card stat"><div class="k">Version</div><div class="v" id="version">-</div></div></section><section class="card"><div class="head">Parkansicht</div><div class="body"><div class="map"><img id="map" src="/map/current.png" alt="Parkansicht"></div></div></section><section class="card"><div class="head">Spieler online</div><div class="body"><div class="players" id="players"><span class="muted">Lade...</span></div></div></section></main>
<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
async function refresh(){try{const response=await fetch('/api/status');const state=await response.json();const server=state.server||{};document.title=(server.name||'OpenRCT2 Server')+' · OpenRCT2';document.getElementById('brand').textContent=state.siteTitle||'OpenRCT2 Server';document.getElementById('name').textContent=server.name||'OpenRCT2 Server';document.getElementById('description').textContent=server.description||'Multiplayer-Park';const online=server.state==='running';const status=document.getElementById('status');status.textContent=online?'Online':'Offline';status.className='v '+(online?'online':'offline');document.getElementById('address').textContent=server.address||'-';document.getElementById('playerCount').textContent=(state.players||[]).length+' / '+(server.maxPlayers||'-');document.getElementById('version').textContent=server.version||'-';document.getElementById('players').innerHTML=(state.players||[]).map(player=>'<span class="pill">'+esc(player.name)+'</span>').join('')||'<span class="muted">Keine Spieler online.</span>';const map=state.map||{};document.getElementById('map').src=map.image||'/static/park-demo.svg'}catch(error){document.getElementById('status').textContent='Nicht erreichbar'}}
refresh();setInterval(refresh,10000);
</script>
</body>
</html>
