<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenRCT2 Server</title><style>:root{--navy:#17384b;--cyan:#00a9d6;--bg:#eef4f7;--line:#d8e2e7;--ink:#334a59;--muted:#71828d;--green:#269b5c;--red:#be4545}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}header{background:var(--navy);border-bottom:4px solid var(--cyan)}.bar,.wrap{max-width:1100px;margin:auto;padding-left:18px;padding-right:18px}.bar{height:70px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:800;color:#fff}.brand span{color:#67d8f3}a{color:#d9f6ff;text-decoration:none;font-weight:700}.hero{background:linear-gradient(135deg,#0ba3cd,#087da7);color:#fff;text-align:center;padding:42px 18px}.hero h1{font-size:34px;margin:0}.hero p{color:#d9f6ff;font-size:17px}.wrap{margin-top:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 2px 12px #17384b18;margin-bottom:16px}.stat,.body{padding:18px}.k{font-size:12px;text-transform:uppercase;color:#788892;letter-spacing:.06em}.v{font-size:21px;font-weight:700;color:#24485e;margin-top:5px}.online{color:var(--green)}.offline{color:var(--red)}.head{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;color:#24485e}.map{min-height:420px;border:1px solid var(--line);background:#d8eef4;border-radius:5px;display:grid;place-items:center;overflow:hidden}.map img{max-width:100%;max-height:620px;display:block}.dots{display:flex;justify-content:center;gap:8px;margin-top:12px}.dots button{width:11px;height:11px;border:0;border-radius:50%;background:#b5c8cf;padding:0}.dots button.active{background:var(--cyan)}.players{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:20px;background:#edf4f7;color:#526d7c}.muted,#error{font-size:13px;color:var(--muted)}#error{color:var(--red)}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.map{min-height:320px}}@media(max-width:480px){.stats{grid-template-columns:1fr}}</style></head><body><header><div class="bar"><div class="brand" id="brand"><span>server</span>verwalter.com</div><a href="https://openrct2.io/download" target="_blank" rel="noopener">OpenRCT2 herunterladen</a></div></header><section class="hero"><h1 id="name">OpenRCT2 Server</h1><p id="desc">Multiplayer-Park</p></section><main class="wrap"><div class="stats"><div class="card stat"><div class="k">Status</div><div class="v" id="online">-</div></div><div class="card stat"><div class="k">Spieler</div><div class="v"><span id="count">-</span> / <span id="max">-</span></div></div><div class="card stat"><div class="k">Version</div><div class="v" id="version">-</div></div><div class="card stat"><div class="k">Park</div><div class="v" id="park">-</div></div></div><section class="card"><div class="head">Parkansichten</div><div class="body"><div class="map"><img id="map" src="/static/park-demo.svg" alt="Parkansicht"></div><div class="dots" id="dots"></div><p class="muted">Stand des aktiven Savegames: <b id="updated">-</b></p></div></section><section class="card"><div class="head">Spieler online</div><div class="body"><div class="players" id="players"></div><p class="muted">Serveradresse: <b id="address">-</b></p><p id="error"></p></div></section></main><script>const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));let images=[],index=0,timer;async function requestJson(url){const response=await fetch(url);const text=await response.text();let data={};try{data=text?JSON.parse(text):{}}catch{throw new Error('Ungültige Serverantwort (HTTP '+response.status+')')}if(!response.ok||data.ok===false)throw new Error(data.error||'HTTP '+response.status);return data}function showImage(next){if(!images.length)return;index=(next+images.length)%images.length;$('map').src=images[index].image;$('dots').innerHTML=images.map((image,i)=>'<button class="'+(i===index?'active':'')+'" aria-label="Ansicht '+(i+1)+'" onclick="showImage('+i+')"></button>').join('')}async function load(){try{const status=await requestJson('/api/status'),server=status.server||{},running=server.state==='running'||server.online,map=status.map||{};document.title=(status.siteTitle||'OpenRCT2 Server')+' · OpenRCT2';$('brand').textContent=status.siteTitle||'OpenRCT2 Server';$('name').textContent=server.name||'OpenRCT2 Server';$('desc').textContent=server.description||'Multiplayer-Park';$('online').textContent=running?'ONLINE':'OFFLINE';$('online').className='v '+(running?'online':'offline');$('count').textContent=(status.players||[]).length;$('max').textContent=server.maxPlayers||'-';$('version').textContent=server.version||'-';$('park').textContent=server.park||'-';$('address').textContent=server.address||('Port '+(server.port||11753));$('updated').textContent=map.updated||'-';images=map.images?.length?map.images:[{image:map.image||'/static/park-demo.svg'}];showImage(index);clearInterval(timer);if(images.length>1)timer=setInterval(()=>showImage(index+1),6000);$('players').innerHTML=(status.players||[]).map(player=>'<span class="pill">'+esc(player.name)+'</span>').join('')||'<span class="muted">Derzeit keine Spieler online.</span>';$('error').textContent=''}catch(error){$('error').textContent=error.message}}load();setInterval(load,15000);</script></body></html>
