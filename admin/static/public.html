<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenRCT2 Server</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<style>
:root{--navy:#17384b;--cyan:#00a9d6;--bg:#eef4f7;--ink:#334a59}body{background:var(--bg);color:var(--ink)}.site-header{background:var(--navy);border-bottom:4px solid var(--cyan)}.brand{font-size:1.4rem;font-weight:800;color:#fff}.hero{background:linear-gradient(135deg,#0ba3cd,#087da7);color:#fff}.hero p{color:#d9f6ff}.metric{border:0;box-shadow:0 2px 12px #17384b18}.metric .label{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:#71828d}.metric .value{font-size:1.3rem;font-weight:700;color:#24485e}.carousel-frame{background:#d8eef4;border-radius:.5rem;overflow:hidden}.carousel-item img{display:block;width:100%;height:min(58vw,620px);min-height:260px;object-fit:contain}.carousel-caption{background:#17384bd9;border-radius:.4rem;padding:.35rem .65rem;bottom:1rem;display:inline-block;left:50%;right:auto;transform:translateX(-50%)}.player-pill{background:#edf4f7;color:#526d7c}.site-footer{margin-top:2rem;padding:1.5rem;background:var(--navy);border-top:4px solid var(--cyan);color:#d9f6ff}.online{color:#269b5c!important}.offline{color:#be4545!important}@media(max-width:575.98px){.brand{font-size:1.15rem}.hero h1{font-size:1.7rem}.carousel-item img{height:58vw;min-height:210px}.carousel-caption{font-size:.75rem}}
</style>
</head>
<body>
<header class="site-header py-3"><div class="container"><div class="brand" id="brand" style="visibility:hidden"><img src="/static/favicon.svg" alt="" width="30" height="30" class="me-2 align-text-bottom">OpenRCT2 Server</div></div></header>
<section class="hero py-5 text-center"><div class="container"><h1 class="display-6 fw-bold mb-2" id="name" style="visibility:hidden">OpenRCT2 Server</h1><p class="lead mb-3" id="description" style="visibility:hidden">Multiplayer-Park</p><a class="btn btn-light fw-bold" href="https://openrct2.io/download" target="_blank" rel="noopener">OpenRCT2 herunterladen</a></div></section>
<main class="container py-4"><section class="row g-3 mb-3"><div class="col-6 col-lg-3"><div class="card metric h-100"><div class="card-body"><div class="label">Status</div><div class="value" id="status">Lade...</div></div></div></div><div class="col-6 col-lg-3"><div class="card metric h-100"><div class="card-body"><div class="label">Adresse</div><div class="value text-break" id="address">-</div></div></div></div><div class="col-6 col-lg-3"><div class="card metric h-100"><div class="card-body"><div class="label">Spieler</div><div class="value" id="playerCount">-</div></div></div></div><div class="col-6 col-lg-3"><div class="card metric h-100"><div class="card-body"><div class="label">Version</div><div class="value" id="version">-</div></div></div></div></section><section class="card shadow-sm border-0 mb-3"><div class="card-header bg-white fw-bold">Parkansichten</div><div class="card-body"><div class="carousel slide carousel-fade carousel-frame" id="mapCarousel" data-bs-ride="carousel"><div class="carousel-indicators" id="mapIndicators"></div><div class="carousel-inner" id="mapSlides"><div class="carousel-item active"><img src="/static/park-demo.svg" alt="Parkansicht"></div></div><button class="carousel-control-prev" type="button" data-bs-target="#mapCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span><span class="visually-hidden">Zurück</span></button><button class="carousel-control-next" type="button" data-bs-target="#mapCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span><span class="visually-hidden">Weiter</span></button></div><p class="small text-secondary mb-0 mt-3">Die Ansichten wechseln automatisch. Stand: <span id="mapUpdated">-</span></p></div></section><section class="card shadow-sm border-0"><div class="card-header bg-white fw-bold">Spieler online</div><div class="card-body"><div class="d-flex flex-wrap gap-2" id="players"><span class="text-secondary">Lade...</span></div></div></section></main>
<footer class="site-footer text-center"><span id="publicFooter"></span><a id="projectLink" href="https://github.com/" target="_blank" rel="noopener" class="ms-3 text-white fw-bold">GitHub-Projekt</a></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const colors={RED:'#ef5b5b',YELLOW:'#ffe36b',GREEN:'#72d572',LIGHT_BLUE:'#86d7ff',PURPLE:'#d9a4ff',WHITE:'#fff',ORANGE:'#ffad5c',DARK_BLUE:'#769dff',DARK_GREEN:'#5eb56d',LIGHT_PURPLE:'#e0b3ff',LIGHT_PINK:'#ffb2d0',BROWN:'#bd8b60',BLACK:'#1b2730'};
const plainName=value=>String(value??'').replace(/\{[A-Z_]+\}/g,'');
function coloredName(value){let color='';return String(value??'').split(/(\{[A-Z_]+\})/g).map(part=>{const match=part.match(/^\{([A-Z_]+)\}$/);if(match){color=colors[match[1]]||color;return ''}const text=esc(part);return color?'<span style="color:'+color+'">'+text+'</span>':text}).join('')}
function renderCarousel(images,updated){const slides=document.getElementById('mapSlides'),indicators=document.getElementById('mapIndicators');const carousel=document.getElementById('mapCarousel');bootstrap.Carousel.getInstance(carousel)?.dispose();slides.innerHTML=images.map((image,index)=>'<div class="carousel-item '+(index===0?'active':'')+'"><img src="'+esc(image.image)+'" alt="Parkansicht '+(index+1)+'"></div>').join('');indicators.innerHTML=images.map((_,index)=>'<button type="button" data-bs-target="#mapCarousel" data-bs-slide-to="'+index+'" '+(index===0?'class="active" aria-current="true"':'')+' aria-label="Ansicht '+(index+1)+'"></button>').join('');bootstrap.Carousel.getOrCreateInstance(carousel,{interval:6000,ride:'carousel'}).cycle();document.getElementById('mapUpdated').textContent=updated||'-'}
async function refresh(){try{const response=await fetch('/api/status');const state=await response.json();const server=state.server||{};const name=server.name||'OpenRCT2 Server';document.title=plainName(name)+' · OpenRCT2';document.getElementById('brand').innerHTML='<img src="/static/favicon.svg" alt="" width="30" height="30" class="me-2 align-text-bottom">'+esc(state.siteTitle||'OpenRCT2 Server');document.getElementById('name').innerHTML=coloredName(name);document.getElementById('description').textContent=server.description||'Multiplayer-Park';for(const id of ['brand','name','description'])document.getElementById(id).style.visibility='visible';document.getElementById('publicFooter').textContent=state.publicFooterText||'';document.getElementById('projectLink').href=state.projectUrl||'https://github.com/';const online=server.state==='running';const status=document.getElementById('status');status.textContent=online?'Online':'Offline';status.className='value '+(online?'online':'offline');document.getElementById('address').textContent=server.address||'-';document.getElementById('playerCount').textContent=(state.players||[]).length+' / '+(server.maxPlayers||'-');document.getElementById('version').textContent=server.version||'-';document.getElementById('players').innerHTML=(state.players||[]).map(player=>'<span class="badge rounded-pill player-pill">'+esc(player.name)+'</span>').join('')||'<span class="text-secondary">Keine Spieler online.</span>';const map=state.map||{};renderCarousel(map.images?.length?map.images:[{image:map.image||'/static/park-demo.svg'}],map.updated)}catch(error){document.getElementById('status').textContent='Nicht erreichbar'}}
refresh();setInterval(refresh,30000);
</script>
</body>
</html>
