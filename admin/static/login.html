<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login · OpenRCT2 Server</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><style>body{margin:0;background:#eef4f7;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#334a59}.top{height:8px;background:#00a9d6}.box{max-width:390px;margin:12vh auto;background:#fff;border:1px solid #d8e2e7;border-radius:7px;padding:28px;box-shadow:0 3px 20px #17384b20}h1{margin:0 0 5px;color:#183449}p{color:#71828d}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:4px;border:1px solid #ccd9df;font-size:16px}button{margin-top:10px;border:0;background:#00a9d6;color:#fff;font-weight:700;cursor:pointer}.err{color:#c23b3b;min-height:20px}a{color:#087da7}</style></head>
<body><div class="top"></div><div class="box"><h1>OpenRCT2 Server</h1><p>OpenRCT2 Server Console · Admin Login</p><form id="login"><input id="password" type="password" placeholder="Admin-Passwort" autofocus required><button>Anmelden</button></form><div class="err" id="error"></div><p><a href="/public">Zur öffentlichen Server-Seite</a></p></div><script>document.getElementById('login').addEventListener('submit',async event=>{event.preventDefault();const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const text=await response.text();let data={};try{data=text?JSON.parse(text):{}}catch{document.getElementById('error').textContent='Ungültige Serverantwort (HTTP '+response.status+')';return}if(response.ok&&data.ok!==false){location.href='/admin';return}document.getElementById('error').textContent=data.error||'Login fehlgeschlagen'});</script></body>
</html>
